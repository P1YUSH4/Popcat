<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Welcome to Pao 🐾</title>
  <style>
    :root { --ink:#2b263a; --pink:#fa98b2; --bell:#ffd24d; --line:#e3e1ec; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 13px ui-sans-serif, system-ui, sans-serif;
      color: var(--ink); background: #fff7f7; padding: 18px; text-align: center;
    }
    h1 { margin: 0 0 2px; font-size: 18px; }
    .sub { color: #8a8598; font-size: 12px; margin: 0 0 12px; }
    .card { background: #fff; border: 2px solid var(--line); border-radius: 14px;
            padding: 14px; margin-bottom: 14px; }
    canvas { image-rendering: pixelated; background:
      repeating-conic-gradient(#f4f1f7 0% 25%, #fbf9fd 0% 50%) 50% / 22px 22px;
      border-radius: 12px; border: 2px solid var(--line); }
    .field { text-align: left; }
    .field > label { display:block; font-weight:600; margin: 0 0 6px; }
    input[type=text] { width: 100%; padding: 9px 11px; border: 2px solid var(--line);
            border-radius: 10px; font: inherit; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff;
          box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0;
          position: relative; transition: transform .08s; }
    .sw:hover { transform: scale(1.08); }
    .sw.on { box-shadow: 0 0 0 3px var(--ink); }
    .sw.none { background: #fff; color: #c44; font-weight: bold; line-height: 30px; font-size: 16px; }
    .lbl { font-weight: 600; margin: 0 0 8px; text-align: left; }
    button.cta { width: 100%; padding: 12px; border: none; border-radius: 12px;
             font: 700 14px ui-sans-serif, sans-serif; color: #fff;
             background: var(--pink); cursor: pointer; }
    button.cta:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <h1>Adopt your cat 🐾</h1>
  <p class="sub">Pick a look and a name — you can change it later from the tray.</p>

  <div class="card">
    <canvas id="preview" width="180" height="180"></canvas>
  </div>

  <div class="card field">
    <label for="name">Name</label>
    <input id="name" type="text" maxlength="24" placeholder="Pao" />
  </div>

  <div class="card">
    <p class="lbl">Fur</p>
    <div id="fur" class="swatches"></div>
  </div>

  <div class="card">
    <p class="lbl">Bell</p>
    <div id="bell" class="swatches"></div>
  </div>

  <button class="cta" id="adopt">Adopt 🐾</button>

  <script src="onboarding.js"></script>
</body>
</html>
